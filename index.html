    skills:{title:'Technical Skills',kind:'skills',items:[
      {title:'Languages',text:'Java, Python, C/C++, SQL (Postgres), JavaScript, HTML/CSS, R'},
      {title:'Frameworks',text:'React, Node.js, Flask, JUnit, WordPress, Material-UI, FastAPI'},
      {title:'Developer Tools',text:'Git, Docker, TravisCI, Google Cloud Platform, VS Code, Visual Studio, PyCharm, IntelliJ, Eclipse'},
      {title:'Libraries',text:'pandas, NumPy, Matplotlib'}
    ]}
  };
  const colors = {summary:'#8b5cf6',education:'#10b981',work:'#667eea',projects:'#f59e0b',extra:'#ec4899',skills:'#06b6d4'};
  const s = {
    header:{name:'Jake Ryan',location:'',contacts:[
      {t:'123-456-7890',u:''},
      {t:'jake@su.edu',u:'mailto:jake@su.edu'},
      {t:'linkedin.com/in/jake',u:'https://linkedin.com/in/jake'},
      {t:'github.com/jake',u:'https://github.com/jake'}]},
    sections:[], items:{}, libOrder:{}, cv:[], versions:{},
    settings:{autofit:true,sound:true,zoom:1}
  };
  let n = 0;
  for (const [sid,sec] of Object.entries(content)){
    s.sections.push({id:sid,title:sec.title,kind:sec.kind,color:colors[sid],hideHeading:!!sec.hideHeading});
    s.libOrder[sid] = [];
    for (const it of sec.items){ const id = sid+'-'+(++n); s.items[id] = {id,sec:sid,...it}; s.libOrder[sid].push(id); }
    if (sec.onCV !== false) s.cv.push({sec:sid,items:[...s.libOrder[sid]]});
  }
  return s;
}


/* ================= state ================= */
let state;
try { state = JSON.parse(localStorage.getItem(STORE)); } catch(e) { state = null; }
if (!state || !state.sections) state = defaults();
state.versions ||= {}; state.settings ||= {autofit:true,sound:true,zoom:1};
// One-time: the summary paragraph becomes an "About" section with a heading like the others.
if (!state.migAbout){
  const sm = state.sections.find(s=>s.id==='summary');
  if (sm){ if (sm.title==='Profile') sm.title='About'; sm.hideHeading=false; }
  state.migAbout = true;
}
const ui = {collapsed:{}, editing:null};
const S = {scale:1};
const $ = s=>document.querySelector(s);
const page = $('#page'), inner = page.querySelector('.cv-inner'), stage = $('#stage'), library = $('#library'), libList = $('#libList'), editor = $('#editor'), mainEl = $('#main');

const uid = ()=>Math.random().toString(36).slice(2,9);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md = s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const secById = id=>state.sections.find(s=>s.id===id);
const cvSec = id=>state.cv.find(s=>s.sec===id);
const isPlaced = id=>state.cv.some(s=>s.items.includes(id));
const htmlToEl = h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
function removeItemFromCV(id){ state.cv.forEach(s=>s.items=s.items.filter(x=>x!==id)); }

/* ================= history & persistence ================= */
const hist = {past:[],future:[]};
const snap = ()=>{ syncTab(); return JSON.stringify({header:state.header,sections:state.sections,items:state.items,libOrder:state.libOrder,tabs:state.tabs,activeTab:state.activeTab}); };
function pushHistory(){ hist.past.push(snap()); if(hist.past.length>100) hist.past.shift(); hist.future=[]; updateUndo(); }
function restoreSnap(j){ Object.assign(state, JSON.parse(j)); state.cv = activeTab().cv; }
function undo(){ if(!hist.past.length) return; hist.future.push(snap()); restoreSnap(hist.past.pop()); afterHistory(); }
function redo(){ if(!hist.future.length) return; hist.past.push(snap()); restoreSnap(hist.future.pop()); afterHistory(); }
function afterHistory(){ if(ui.editing && !editingExists()) closeEditor(true); else if(ui.editing) buildEditor(); renderAll(false); updateUndo(); }
function updateUndo(){ $('#undoBtn').disabled=!hist.past.length; $('#redoBtn').disabled=!hist.future.length; }
let saveT;
function save(){
  $('#saveState').textContent='Saving…';
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{ syncTab(); localStorage.setItem(STORE,JSON.stringify(state)); $('#saveState').textContent='Saved'; }catch(e){ $('#saveState').textContent='Not saved — use backup'; } },250);
}

/* ================= sound ================= */
// Generated with the Web Audio API (no audio files). One family: a soft filtered tap plus a short pure tone, all under 150ms.
// The on/off choice has its own storage key so resetting or restoring a CV never changes it.
const SOUND_KEY = 'blokk.sound';
let soundOn = (()=>{ try{ const v = localStorage.getItem(SOUND_KEY); if (v!==null) return v==='1'; }catch(e){} return state.settings.sound!==false; })();
function setSound(on){ soundOn = on; try{ localStorage.setItem(SOUND_KEY, on?'1':'0'); }catch(e){} }
const sfx = (()=>{
  let ctx, master, lastTick = 0;
  const ac = ()=>{
    if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .55; master.connect(ctx.destination); }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  };
  function tone(f1,f2,dur,vol,delay=0,type='sine'){
    try{
      const c=ac(), t=c.currentTime+delay, o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.004); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(master); o.start(t); o.stop(t+dur+.01);
    }catch(e){}
  }
  function tap(dur,vol,freq,delay=0){
    try{
      const c=ac(), t=c.currentTime+delay, len=Math.ceil(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
      const src=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
      src.buffer=buf; f.type='bandpass'; f.frequency.value=freq; f.Q.value=1.4; g.gain.value=vol;
      src.connect(f).connect(g).connect(master); src.start(t);
    }catch(e){}
  }
  const play = fn => (...a)=>{ if (soundOn) fn(...a); };
  return {
    // pop and tick are the reference: everything else stays as light and clicky as they are
    pick:   play(()=>{ tap(.01,.12,3800); tone(990,990,.03,.014); }),
    tick:   play(()=>{ const n=performance.now(); if(n-lastTick<80) return; lastTick=n; tap(.012,.16,4200); }),
    snap:   play(()=>{ tap(.01,.2,3200); tap(.01,.14,4400,.032); tone(1180,1280,.035,.018,.03); }),
    remove: play(()=>{ tap(.012,.13,2600); tone(620,540,.045,.028); }),
    pop:    play(()=>{ tap(.012,.14,3600); tone(660,760,.055,.04); }),
    click:  play(()=>{ tap(.012,.13,3600); }),
    fit:    play(()=>{ tap(.01,.1,4000); tone(880,880,.04,.022); tone(1175,1175,.05,.022,.045); }),
    exported: play(()=>{ tap(.012,.14,3400); tone(784,784,.04,.024,.01); tone(1046,1046,.05,.024,.055); })
  };
})();

/* ================= rendering: CV ================= */
function itemInner(it, kind){
  if (kind==='skills') return `<div class="sk-line"><span class="sk-title">${md(it.title)}</span>${it.title&&it.text?'<span class="sk-colon">: </span>':''}<span class="sk-text">${md(it.text)}</span></div>`;
  if (kind==='text') return `<p class="t-para">${md(it.text)}</p>`;
  const titleIn = md(it.title)+(it.link?LINK_SVG:'');
  const title = it.title ? (it.link ? `<a class="e-title" href="${esc(it.link)}" target="_blank">${titleIn}</a>` : `<span class="e-title">${titleIn}</span>`) : '';
  const note = it.note ? `<span class="e-note"><span class="dash"></span>${md(it.note)}</span>` : '';
  // Templates choose where tech goes: next to the title (Classic, project style) or on its own line.
  const inlineTech = it.tech && !it.subtitle;
  const tech = inlineTech ? `<span class="e-tech"><span class="bar">|</span>${md(it.tech)}</span>` : '';
  const bullets = (it.bullets||[]).filter(b=>bulletShown(it.id,b) && b.t.trim());
  return `<div class="e-row"><div class="e-left">${title}${note}${tech}</div>${it.date?`<div class="e-date">${md(it.date)}</div>`:''}</div>`
    + (it.subtitle||it.place?`<div class="e-row e-row2">${it.subtitle?`<span class="e-sub">${md(it.subtitle)}</span>`:''}${it.place?`<span class="e-place">${md(it.place)}</span>`:''}</div>`:'')
    + (it.tech?`<div class="e-techline${inlineTech?' dup':''}">${md(it.tech)}</div>`:'')
    + (detailText(it)?`<div class="e-detail">${it.detailLabel?`<span class="lbl">${esc(it.detailLabel)}</span> `:''}${md(detailText(it))}</div>`:'')
    + (bullets.length?`<ul class="e-bullets">${bullets.map(b=>`<li>${md(b.t)}</li>`).join('')}</ul>`:'');
}
function itemHTML(id){
  const it = state.items[id], sec = secById(it.sec);
  return `<div class="cv-item${ui.editing&&ui.editing.id===id?' editing':''}" data-key="item:${id}" data-item="${id}" data-drag="item:${id}" data-click="item:${id}">${itemInner(it,sec.kind)}<button class="ui ui-x" data-act="rmitem" data-id="${id}" title="Remove from CV" aria-label="Remove from CV">${ICON_X}</button></div>`;
}
function sectionHTML(sid, ids){
  const sec = secById(sid);
  return `<section class="cv-sec kind-${sec.kind}${ids.length?'':' is-empty'}${sec.hideHeading?' no-h':''}" data-key="sec:${sid}" data-sec="${sid}" data-title="${esc(sec.title)}">`
    + `<div class="ui sec-grip" data-drag="sec:${sid}" title="Drag section">${GRIP}</div>`
    + `<button class="ui ui-x sec-x" data-act="rmsec" data-id="${sid}" title="Remove section from CV" aria-label="Remove section from CV">${ICON_X}</button>`
    + (sec.hideHeading?'':`<div class="sec-h" data-drag="sec:${sid}" data-click="sec:${sid}">${esc(sec.title)}</div>`)
    + `<div class="sec-body">${ids.map(itemHTML).join('')}<div class="empty-hint">Drop ${esc(sec.title)} blocks here</div></div></section>`;
}
function renderCV(){
  const h = state.header;
  const contacts = h.contacts.filter(c=>c.t).map(c=>c.u?`<a href="${esc(c.u)}">${esc(c.t)}</a>`:esc(c.t)).join('<span class="sep"></span>');
  const sp = (h.name||'').trim().indexOf(' ');
  const name = sp>0 ? `<span class="n1">${md(h.name.trim().slice(0,sp))}</span> <span class="n2">${md(h.name.trim().slice(sp+1))}</span>` : md(h.name);
  inner.innerHTML = `<div class="cv-header${ui.editing&&ui.editing.kind==='header'?' editing':''}" data-key="header" data-click="header:">`
    + `<div class="cv-name">${name}</div>${h.location?`<div class="cv-loc">${md(h.location)}</div>`:''}${contacts?`<div class="cv-contacts">${contacts}</div>`:''}</div>`
    + `<div id="cvSections">${state.cv.map(s=>sectionHTML(s.sec,s.items)).join('')}</div>`;
}

/* ================= auto-fit ================= */
function fit(){
  const avail = PAGE_H - TEMPLATES[tplId()].padY*PT;
  page.classList.add('measuring');
  const set = (fs,sp)=>{ page.style.setProperty('--fs',fs); page.style.setProperty('--sp',sp); };
  const ok = ()=>inner.offsetHeight <= avail;
  const search = (lo,hi,apply)=>{ for(let i=0;i<9;i++){ const m=(lo+hi)/2; apply(m); if(ok()) lo=m; else hi=m; } return lo; };
  let fs=1, sp=1;
  if (state.settings.autofit){
    set(1,1);
    if (ok()){ set(1,1.3); sp = ok() ? 1.3 : search(1,1.3,m=>set(1,m)); }
    else {
      set(1,.45);
      if (ok()) sp = search(.45,1,m=>set(1,m));
      else { sp=.45; set(.82,sp); fs = ok() ? search(.82,1,m=>set(m,sp)) : .82; }
    }
  }
  set(fs,sp);
  page.classList.remove('measuring');
  const total = inner.offsetHeight, pages = Math.max(1,Math.ceil((total-.5)/avail));
  page.style.minHeight = pages*PAGE_H+'px';
  page.querySelector('.breaks').innerHTML = Array.from({length:pages-1},(_,i)=>`<div class="page-break" style="top:${(i+1)*PAGE_H}px"><span>Page ${i+2}</span></div>`).join('');
  const pill = $('#fitPill');
  const fitCls = pages>1?'warn':'ok', fitChanged = !pill.classList.contains(fitCls);
  pill.className = 'fit-pill '+fitCls;
  if (fitChanged){ void pill.offsetWidth; pill.classList.add('changed'); if (fitCls==='ok') sfx.fit(); }
  pill.querySelector('.ind').innerHTML = pages>1?ICON_ALERT:ICON_CHECK;
  const fsTxt = fs<.999?` · text ${Math.round(fs*100)}%`:'';
  $('#fitText').innerHTML = pages>1
    ? `Runs onto ${pages} pages <span class="sub">· remove a block or two</span>`
    : `Fits on one page <span class="sub">${state.settings.autofit?`· spacing ${Math.round(sp*100)}%${fsTxt}`:'· auto-fit off'}</span>`;
  sizeWrap();
}
function sizeWrap(){
  const cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const base = clamp(availW/PAGE_W, .35, 1.25);
  S.scale = base*state.settings.zoom;
  page.style.transform = `scale(${S.scale})`;
  const w = $('#pageWrap'); w.style.width = PAGE_W*S.scale+'px'; w.style.height = page.offsetHeight*S.scale+'px';
  $('#zoomVal').textContent = Math.round(state.settings.zoom*100)+'%';
}

/* ================= motion ================= */
const EASE_OUT = 'cubic-bezier(.23,1,.32,1)';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
// Change the canvas layout (editor open/close), then glide the page and tabs from where they were. Transform only.
function relayout(mutate, instant){
  const wrap = $('#pageWrap'), tabs = $('#tabs');
  const r0 = wrap.getBoundingClientRect(), t0 = tabs.getBoundingClientRect();
  mutate(); sizeWrap();
  if (instant || REDUCED.matches) return;
  const r1 = wrap.getBoundingClientRect(), t1 = tabs.getBoundingClientRect();
  wrap.animate([{transformOrigin:'0 0',transform:`translate(${r0.left-r1.left}px,${r0.top-r1.top}px) scale(${r0.width/r1.width})`},{transformOrigin:'0 0',transform:'none'}],{duration:240,easing:EASE_OUT});
  tabs.animate([{transform:`translateX(calc(-50% + ${t0.left-t1.left}px))`},{transform:'translateX(-50%)'}],{duration:240,easing:EASE_OUT});
}

/* ================= FLIP animation ================= */
function flip(mutate, dur=250){
  if (REDUCED.matches){ mutate(); return; }
  const first = new Map();
  page.querySelectorAll('[data-key]').forEach(el=>first.set(el.dataset.key, el.getBoundingClientRect()));
  const sc0 = S.scale;
  mutate();
  const els = [...page.querySelectorAll('[data-key]')];
  els.forEach(el=>el.getAnimations().forEach(a=>{ if(a.id==='flip'||a.id==='enter') a.cancel(); }));
  const deltas = new Map();
  els.forEach(el=>{
    const f = first.get(el.dataset.key);
    if(!f){ deltas.set(el,null); return; }
    const r = el.getBoundingClientRect();
    deltas.set(el,{x:(f.left-r.left)/S.scale, y:(f.top-r.top)/S.scale});
  });
  if (sc0 !== S.scale) return;
  els.forEach(el=>{
    const d = deltas.get(el);
    const p = el.parentElement.closest('[data-key]');
    const pd = p ? deltas.get(p) : null;
    if(!d){ if(!(p && pd===null)){ const a=el.animate([{opacity:0,transform:'scale(.97)'},{}],{duration:200,easing:EASE_OUT}); a.id='enter'; } return; }
    const x = d.x-(pd?.x||0), y = d.y-(pd?.y||0);
    if(Math.abs(x)<.5 && Math.abs(y)<.5) return;
    const a = el.animate([{transform:`translate(${x}px,${y}px)`},{transform:'none'}],{duration:dur,easing:EASE_OUT});
    a.id='flip';
  });
}

/* ================= rendering: library ================= */
function libCard(id){
  const it = state.items[id], sec = secById(it.sec), p = isPlaced(id);
  let title, meta;
  if (sec.kind==='text'){ title = 'Paragraph'; meta = it.text; }
  else if (sec.kind==='skills'){ title = it.title||'Untitled group'; meta = it.text; }
  else { title = it.title||'Untitled block'; meta = [it.subtitle,it.place,it.date].filter(Boolean).join(' · ') || it.tech || (it.bullets?.[0]?.t ?? ''); }
  const ed = ui.editing && ui.editing.id===id ? ' editing':'';
  return `<div class="lib-card${p?' placed':''}${ed}" data-drag="item:${id}" data-click="item:${id}" data-libitem="${id}"><div class="lc-text"><div class="lc-title">${md(title)}</div>${meta?`<div class="lc-meta">${md(meta)}</div>`:''}</div><button class="lc-badge" data-act="toggle" data-id="${id}" title="${p?'On the CV · click to remove':'Add to the CV'}" aria-label="${p?'On the CV, remove':'Add to the CV'}">${p?ICON_CHECK:'Add'}</button></div>`;
}
function renderLibrary(){
  let h='', total=0, placed=0;
  for (const s of state.sections){
    const ids = state.libOrder[s.id]||[]; const pc = ids.filter(isPlaced).length; total+=ids.length; placed+=pc;
    h += `<div class="lib-sec${ui.collapsed[s.id]?' collapsed':''}${cvSec(s.id)?' on-cv':''}" style="--c:${s.color}" data-libsec="${s.id}">
      <div class="lib-sec-head" data-drag="sec:${s.id}" data-act="collapse" data-id="${s.id}" title="Drag onto the page to add the whole section">
        <span class="grip">${GRIP}</span><span class="dot"></span><span class="ls-name">${esc(s.title)}</span>
        <span class="ls-count">${pc}/${ids.length}</span>
        <button class="mini" data-act="additem" data-id="${s.id}" title="New block" aria-label="New block">${ICON_PLUS}</button>
        <button class="mini" data-act="editsec" data-id="${s.id}" title="Edit section" aria-label="Edit section">${ICON_EDIT}</button>
        <span class="chev">${CHEV}</span>
      </div>
      <div class="lib-items-wrap"><div class="lib-items"><div class="lib-items-inner">${ids.map(libCard).join('')||'<div class="lib-empty">No blocks yet — hit +</div>'}</div></div></div>
    </div>`;
  }
  h += `<button class="lib-new" data-act="newsec">+ New section</button>`;
  libList.innerHTML = h;
  $('#libCount').textContent = `${placed} of ${total} on CV`;
}

/* ================= version tabs =================
   The library (blocks) is shared. Each tab is a live layout: which blocks are
   on the page and in what order. state.cv always points at the active tab's layout. */
function tplId(){ const t = state.tabs && activeTab()?.template; return TEMPLATES[t] ? t : 'classic'; }
function applyTemplate(){ page.className = page.className.replace(/\btpl-\S+/g,'').trim() + ' tpl-' + tplId(); $('#tplName').textContent = TEMPLATES[tplId()].name; }
function activeTab(){ return state.tabs.find(t=>t.id===state.activeTab) || state.tabs[0]; }
function syncTab(){ const t = state.tabs && activeTab(); if (t) t.cv = state.cv; }
function migrateTabs(){
  if (!Array.isArray(state.tabs) || !state.tabs.length){
    // Older saves kept frozen "versions"; each becomes a live tab.
    state.tabs = [{id:uid(), name:'Main', cv:state.cv||[]}];
    for (const [name,v] of Object.entries(state.versions||{})) state.tabs.push({id:uid(), name, cv:v.cv||[]});
    state.activeTab = state.tabs[0].id;
  }
  delete state.versions;
  const t = activeTab(); state.activeTab = t.id; state.cv = t.cv;
}
// Drop sections and blocks that no longer exist in the library from every tab.
function pruneTabs(){
  syncTab();
  for (const t of state.tabs) t.cv = t.cv.filter(s=>secById(s.sec)).map(s=>({sec:s.sec, items:s.items.filter(id=>state.items[id])}));
  state.cv = activeTab().cv;
  ensureBulletIds();
}

/* ---- per-tab ticks ----
   Block text is shared; which bullets and classes show is remembered per tab:
   tab.hidden[itemId] = {b:[bullet ids], d:true when the detail (Classes) line is hidden} */
function tabHidden(itemId, create){
  const t = activeTab(); t.hidden ||= {};
  if (!t.hidden[itemId]){ if (!create) return null; t.hidden[itemId] = {b:[]}; }
  return t.hidden[itemId];
}
function bulletShown(itemId, b){ const h = tabHidden(itemId); return !(h && h.b.includes(b.id)); }
function detailShown(itemId){ const h = tabHidden(itemId); return !(h && h.d); }
function detailText(it){ return it.detail && detailShown(it.id) ? it.detail : ''; }
function toggleHidden(itemId, kind, key, show){
  const h = tabHidden(itemId, true);
  if (kind==='d'){ if (show) delete h.d; else h.d = true; return; }
  const list = h[kind], i = list.indexOf(key);
  if (show && i>=0) list.splice(i,1);
  if (!show && i<0) list.push(key);
}
// Bullets get stable ids so ticks survive reordering; old global "on:false" becomes hidden in every tab.
function ensureBulletIds(){
  for (const it of Object.values(state.items)){
    for (const b of it.bullets||[]){
      if (!b.id) b.id = uid();
      if ('on' in b){
        if (b.on===false) for (const t of state.tabs){ t.hidden ||= {}; const h = t.hidden[it.id] ||= {b:[]}; if(!h.b.includes(b.id)) h.b.push(b.id); }
        delete b.on;
      }
    }
  }
}
function renderTabs(){
  const el = $('#tabs');
  el.classList.toggle('single', state.tabs.length===1);
  el.innerHTML = state.tabs.map(t=>`<button class="tab${t.id===state.activeTab?' active':''}" data-act="tab-switch" data-id="${t.id}" title="Double-click to rename"><span class="tab-name">${esc(t.name)}</span><span class="tab-x" data-act="tab-close" data-id="${t.id}" title="Close this version" aria-label="Close this version">${ICON_X}</span></button>`).join('')
    + `<button class="tab-add" data-act="tab-new" title="New version (starts as a copy of this one)" aria-label="New version">${ICON_PLUS}</button>`;
}
function renameTab(id){
  const btn = $(`#tabs .tab[data-id="${id}"]`), t = state.tabs.find(x=>x.id===id); if(!btn||!t) return;
  const name = btn.querySelector('.tab-name');
  const inp = document.createElement('input'); inp.type='text'; inp.value=t.name;
  name.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = ok=>{ if(done) return; done = true; if(ok && inp.value.trim()){ t.name = inp.value.trim(); save(); } renderTabs(); };
  inp.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Enter') finish(true); if(e.key==='Escape') finish(false); });
  inp.addEventListener('blur', ()=>finish(true));
  inp.addEventListener('click', e=>e.stopPropagation());
}
function switchTab(id){
  if (id===state.activeTab) return;
  syncTab();
  state.activeTab = id; state.cv = activeTab().cv;
  if (ui.editing) buildEditor();
  renderAll(true); sfx.click();
}

function renderAll(animate=true){
  pruneTabs();
  const m = ()=>{ applyTemplate(); renderCV(); fit(); };
  animate ? flip(m) : m();
  renderLibrary();
  renderTabs();
  save();
}
function pulse(key){
  const el = page.querySelector(`[data-key="${key}"]`);
  if(!el) return;
  el.classList.remove('snapped'); void el.offsetWidth; el.classList.add('snapped');
  setTimeout(()=>el.classList.remove('snapped'),700);
}

/* ================= drag & drop engine ================= */
let pend=null, drag=null, suppressClick=false;
document.addEventListener('pointerdown', e=>{
  if (e.button!==0 || drag) return;
  if (e.target.closest('button,input,textarea,select,label')) return;
  const h = e.target.closest('[data-drag]');
  if (!h) return;
  e.preventDefault();
  pend = {h, x:e.clientX, y:e.clientY};
});
document.addEventListener('pointermove', e=>{
  if (pend && !drag && Math.hypot(e.clientX-pend.x, e.clientY-pend.y) > 5) startDrag(pend, e);
  if (drag) moveDrag(e);
});
document.addEventListener('pointerup', ()=>{
  if (drag){ endDrag(); suppressClick=true; setTimeout(()=>suppressClick=false,0); }
  pend=null;
});
window.addEventListener('blur', ()=>{ if(drag) endDrag(true); pend=null; });

function startDrag(p, e){
  pend = null;
  const [type,id] = p.h.dataset.drag.split(':');
  const inPage = !!p.h.closest('#page');
  const visual = inPage ? p.h.closest('[data-key]') : (p.h.closest('.lib-card') || p.h.closest('.lib-sec-head'));
  const r = visual.getBoundingClientRect(), sc = inPage ? S.scale : 1;

  const wrap = document.createElement('div');
  wrap.className = 'drag-clone ' + (inPage ? 'cv cv-clone tpl-'+tplId() : 'lib-clone');
  // Breathing room around a block picked up from the page (in page units, so it looks the same at any zoom).
  const pad = inPage ? 12/sc : 0;
  if (inPage) wrap.style.setProperty('--pad', pad+'px');
  if (inPage){
    wrap.style.setProperty('--fs', page.style.getPropertyValue('--fs')||1);
    wrap.style.setProperty('--sp', page.style.getPropertyValue('--sp')||1);
    wrap.style.width = (visual.offsetWidth + pad*2)+'px';
  } else {
    wrap.style.width = r.width+'px';
    const ls = visual.closest('.lib-sec'); if (ls) wrap.style.setProperty('--c', ls.style.getPropertyValue('--c'));
  }
  const c = visual.cloneNode(true);
  c.removeAttribute('data-key'); c.querySelectorAll('[data-key]').forEach(x=>x.removeAttribute('data-key'));
  c.classList.remove('editing','snapped');
  wrap.appendChild(c); document.body.appendChild(wrap);
  const ox = (p.x-r.left)/sc + pad, oy = (p.y-r.top)/sc + pad;
  wrap.style.transformOrigin = `${ox}px ${oy}px`;
  wrap.style.left = (p.x-ox)+'px'; wrap.style.top = (p.y-oy)+'px';
  wrap.style.transform = `scale(${sc})`;
  requestAnimationFrame(()=>wrap.classList.add('lifted'));

  // Decide what the ghost (live preview on the page) is.
  const secId = type==='sec' ? id : state.items[id].sec;
  const existing = type==='item' ? page.querySelector(`.cv-item[data-item="${id}"]`) : page.querySelector(`.cv-sec[data-sec="${id}"]`);
  let ghost, gmode;
  if (existing){ ghost = existing; gmode = type==='item' ? 'item' : 'section'; }
  else if (type==='item' && cvSec(secId)){ ghost = htmlToEl(itemHTML(id)); gmode='item'; }
  else if (type==='item'){ ghost = htmlToEl(sectionHTML(secId,[id])); gmode='section'; }
  else { ghost = htmlToEl(sectionHTML(id, state.libOrder[id]||[])); gmode='section'; }
  ghost.classList.add('ghost'); ghost.classList.remove('editing');

  drag = {type,id,secId,wrap,ox,oy,sc,pad,ghost,gmode,existed:!!existing,fromLib:!inPage,visual,srcRect:r,
          mode: existing?'place':'none', lastX:p.x, tilt:0, x:e.clientX, y:e.clientY};
  if (!inPage) visual.classList.add('lifting');
  document.body.classList.add('is-dragging');
  if (existing) document.body.classList.add('drag-from-cv');
  if (gmode==='item') page.querySelector(`.cv-sec[data-sec="${secId}"]`)?.classList.add('drop-ok');
  else page.classList.add('drop-page');
  sfx.pick();
  requestAnimationFrame(autoScroll);
}

function moveDrag(e){
  const d = drag;
  d.x = e.clientX; d.y = e.clientY;
  const vx = e.clientX - d.lastX; d.lastX = e.clientX;
  d.tilt = d.tilt*.6 + clamp(vx*.45,-7,7)*.4;
  d.wrap.style.left = (e.clientX-d.ox)+'px';
  d.wrap.style.top = (e.clientY-d.oy)+'px';
  d.wrap.style.transform = `scale(${(d.sc*1.035).toFixed(4)}) rotate(${(-1.2+d.tilt).toFixed(2)}deg)`;
  updateTarget();
}

function lrect(el){ let t=0,l=0,n=el; while(n && n!==page){ t+=n.offsetTop; l+=n.offsetLeft; n=n.offsetParent; } return {top:t,left:l,w:el.offsetWidth,h:el.offsetHeight}; }
function beforeV(kids,y){ for(const c of kids){ const r=lrect(c); if(y < r.top + r.h/2) return c; } return null; }
function before2D(kids,x,y){ for(const c of kids){ const r=lrect(c); if(y < r.top) return c; if(y < r.top+r.h && x < r.left + r.w/2) return c; } return null; }

function updateTarget(){
  const d = drag, {x,y} = d;
  const lr = library.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  const inLib = x>=lr.left && x<lr.right && y>=lr.top && y<=lr.bottom;
  const er = editor.classList.contains('open') ? editor.getBoundingClientRect() : null;
  const inStage = x>=sr.left && x<=sr.right && y>=sr.top && y<=sr.bottom && !(er && x>=er.left && y>=er.top && y<=er.bottom);
  if (inLib){
    if (d.ghost.isConnected) flip(()=>d.ghost.remove());
    d.mode = d.existed ? 'remove' : 'none';
    $('#removeZone').classList.toggle('show', d.existed);
    return;
  }
  $('#removeZone').classList.remove('show');
  if (!inStage) return;
  const pr = page.getBoundingClientRect();
  const lx = (x-pr.left)/S.scale, ly = (y-pr.top)/S.scale;
  let parent, ref;
  if (d.gmode==='item'){
    const sec = page.querySelector(`.cv-sec[data-sec="${d.secId}"]`);
    parent = sec.querySelector('.sec-body');
    const kids = [...parent.children].filter(c=>c.classList.contains('cv-item') && c!==d.ghost);
    ref = (getComputedStyle(parent).display==='flex' ? before2D(kids,lx,ly) : beforeV(kids,ly)) || parent.querySelector(':scope > .empty-hint');
  } else {
    parent = page.querySelector('#cvSections');
    const kids = [...parent.children].filter(c=>c!==d.ghost);
    ref = beforeV(kids, ly);
  }
  d.mode = 'place';
  if (d.ghost.parentNode===parent && d.ghost.nextElementSibling===ref) return;
  flip(()=>parent.insertBefore(d.ghost, ref));
  sfx.tick();
}

function autoScroll(){
  if (!drag) return;
  const r = stage.getBoundingClientRect(), d = drag;
  let v = 0;
  if (d.x>r.left && d.x<r.right){
    if (d.y < r.top+80) v = -Math.pow((r.top+80-d.y)/80,2)*22;
    else if (d.y > r.bottom-80) v = Math.pow((d.y-(r.bottom-80))/80,2)*22;
  }
  if (v){ const before = stage.scrollTop; stage.scrollTop += v; if (stage.scrollTop!==before) updateTarget(); }
  requestAnimationFrame(autoScroll);
}

function endDrag(cancel=false){
  const d = drag; drag = null;
  document.body.classList.remove('is-dragging','drag-from-cv');
  $('#removeZone').classList.remove('show');
  page.classList.remove('drop-page');
  page.querySelectorAll('.drop-ok').forEach(el=>el.classList.remove('drop-ok'));
  d.visual.classList.remove('lifting');
  const w = d.wrap;
  if (!cancel && d.mode==='place' && d.ghost.isConnected){
    const g = d.ghost, gr = g.getBoundingClientRect();
    pushHistory();
    let key;
    if (d.gmode==='item'){
      const idx = [...g.parentElement.children].filter(c=>c.classList.contains('cv-item')).indexOf(g);
      removeItemFromCV(d.id);
      cvSec(d.secId).items.splice(idx,0,d.id);
      key = 'item:'+d.id;
    } else {
      const idx = [...g.parentElement.children].indexOf(g);
      const prev = cvSec(d.secId);
      const items = d.type==='sec' ? (prev ? prev.items : [...(state.libOrder[d.id]||[])]) : [d.id];
      if (d.type==='item') removeItemFromCV(d.id);
      state.cv = state.cv.filter(s=>s.sec!==d.secId);
      state.cv.splice(idx,0,{sec:d.secId,items});
      key = d.type==='sec' ? 'sec:'+d.secId : 'item:'+d.id;
    }
    // Fly the floating copy into its slot, then settle.
    const s = S.scale;
    w.classList.add('flying');
    const L = parseFloat(w.style.left), T = parseFloat(w.style.top);
    const k = d.fromLib ? Math.min(1, gr.width/w.offsetWidth) : s;
    const tx = gr.left - L - d.ox + d.ox*k - d.pad*k, ty = gr.top - T - d.oy + d.oy*k - d.pad*k;
    w.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;
    w.style.opacity = '0';
    renderAll(true);
    sfx.snap();
    pulse(key);
    if (ui.editing) markEditing();
    setTimeout(()=>w.remove(), 260);
  } else if (!cancel && d.mode==='remove'){
    pushHistory();
    if (d.type==='item') removeItemFromCV(d.id); else state.cv = state.cv.filter(s=>s.sec!==d.id);
    w.classList.add('poof');
    w.style.transform = `scale(${d.sc*.9})`;
    renderAll(true);
    sfx.remove();
    const card = d.type==='item' && libList.querySelector(`[data-libitem="${d.id}"]`);
    if (card){ card.classList.add('flash'); }
    setTimeout(()=>w.remove(), 170);
  } else {
    if (d.ghost.isConnected && !d.existed) flip(()=>d.ghost.remove());
    d.ghost.classList.remove('ghost');
    w.classList.add('returning');
    const r = d.srcRect;
    const L = parseFloat(w.style.left), T = parseFloat(w.style.top);
    w.style.transform = `translate(${r.left - d.ox + d.ox*d.sc - d.pad*d.sc - L}px,${r.top - d.oy + d.oy*d.sc - d.pad*d.sc - T}px) scale(${d.sc})`; w.style.opacity = '0';
    setTimeout(()=>w.remove(), 240);
    if (d.existed) renderAll(true);
  }
}

/* ================= quick actions ================= */
function addToCV(id){
  pushHistory();
  const sid = state.items[id].sec;
  let s = cvSec(sid);
  if (!s){
    // Insert the section at its library position relative to the sections already on the CV.
    const order = state.sections.map(x=>x.id);
    const pos = state.cv.findIndex(c=>order.indexOf(c.sec) > order.indexOf(sid));
    s = {sec:sid,items:[]};
    pos<0 ? state.cv.push(s) : state.cv.splice(pos,0,s);
  }
  const lib = state.libOrder[sid];
  const myIdx = lib.indexOf(id);
  const at = s.items.findIndex(x=>lib.indexOf(x) > myIdx);
  at<0 ? s.items.push(id) : s.items.splice(at,0,id);
  renderAll(true); sfx.snap(); pulse('item:'+id);
}
function removeFromCV(id){ pushHistory(); removeItemFromCV(id); renderAll(true); sfx.remove(); }

function newItem(sid){
  const sec = secById(sid), id = sid+'-'+uid();
  const base = sec.kind==='skills' ? {title:'New group',text:''} : sec.kind==='text' ? {text:''} : {title:'New entry',subtitle:'',date:'',bullets:[{id:uid(),t:''}]};
  pushHistory();
  state.items[id] = {id,sec:sid,...base};
  (state.libOrder[sid] ||= []).push(id);
  ui.collapsed[sid] = false;
  renderAll(false);
  openEditor('item',id);
  libList.querySelector(`[data-libitem="${id}"]`)?.classList.add('flash');
  sfx.pop();
}

/* ================= editor ================= */
function editingExists(){ const e=ui.editing; if(!e) return false; if(e.kind==='item') return !!state.items[e.id]; if(e.kind==='sec') return !!secById(e.id); return true; }
function openEditor(kind,id){
  ui.editing = {kind,id};
  buildEditor();
  if (!editor.classList.contains('open')) relayout(()=>{ editor.classList.add('open'); mainEl.classList.add('editor-open'); });
  markEditing();
  setTimeout(scrollToEditing, 250);
}
// instant: closed from the keyboard (Esc, undo), so no slide
function closeEditor(instant){
  ui.editing = null;
  editor.classList.toggle('instant', !!instant);
  relayout(()=>{ editor.classList.remove('open'); mainEl.classList.remove('editor-open'); }, instant);
  markEditing();
  if (instant) requestAnimationFrame(()=>requestAnimationFrame(()=>editor.classList.remove('instant')));
}
function markEditing(){
  document.querySelectorAll('.editing').forEach(el=>el.classList.remove('editing'));
  const e = ui.editing; if(!e) return;
  if (e.kind==='item'){ page.querySelector(`[data-item="${e.id}"]`)?.classList.add('editing'); libList.querySelector(`[data-libitem="${e.id}"]`)?.classList.add('editing'); }
  if (e.kind==='header') page.querySelector('.cv-header')?.classList.add('editing');
}
function scrollToEditing(){
  const el = page.querySelector('.editing'); if(!el) return;
  const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  if (r.top < sr.top+40 || r.bottom > sr.bottom-60) stage.scrollBy({top: r.top - sr.top - 120, behavior: REDUCED.matches ? 'auto' : 'smooth'});
}

const fld = (f,label,val,opts={})=>{
  const ph = opts.ph?` placeholder="${esc(opts.ph)}"`:'';
  const lab = `<label>${label}${opts.hint?` <em>${opts.hint}</em>`:''}</label>`;
  return opts.area
    ? `<div class="fld">${lab}<textarea data-f="${f}" rows="${opts.rows||2}"${ph}>${esc(val)}</textarea></div>`
    : `<div class="fld">${lab}<input type="text" data-f="${f}" value="${esc(val)}"${ph}></div>`;
};

function buildEditor(){
  const e = ui.editing; if(!e) return;
  let chip='', color='#667eea', title='', body='', foot='';
  if (e.kind==='item'){
    const it = state.items[e.id], sec = secById(it.sec); color = sec.color; chip = sec.title;
    const placed = isPlaced(e.id);
    title = 'Edit block';
    if (sec.kind==='skills'){
      body = fld('title','Group name',it.title) + fld('text','Items',it.text,{area:true,rows:3,hint:'comma separated'});
    } else if (sec.kind==='text'){
      body = fld('text','Paragraph',it.text,{area:true,rows:6});
    } else {
      body = fld('title','Title',it.title)
        + fld('note','Title note',it.note,{ph:'e.g. Predicted: First Class Honours',hint:'optional'})
        + fld('subtitle','Organisation / degree',it.subtitle,{hint:'optional'})
        + fld('place','Location',it.place,{ph:'City, Country',hint:'optional'})
        + fld('date','Date',it.date,{ph:'Jun 2026 - Aug 2026'})
        + fld('link','Link',it.link,{ph:'https://github.com/…',hint:'adds a link icon'})
        + fld('tech','Tech / tools',it.tech,{ph:'Python, React, Docker',hint:'optional'})
        + `<div class="fld"><div class="d-label"><label>Detail line <em>optional</em></label>${it.detail?`<label class="d-show"><input type="checkbox" class="chk" data-dshow="1"${detailShown(it.id)?' checked':''}> Show in this version</label>`:''}</div><div class="row2"><input type="text" data-f="detailLabel" value="${esc(it.detailLabel)}" placeholder="Classes:"><textarea data-f="detail" rows="2" placeholder="Course A, Course B…">${esc(it.detail)}</textarea></div></div>`
        + `<span class="ed-label">Bullet points <em style="font-style:normal;color:var(--faint);font-weight:500">— ticks apply to this version only</em></span><div class="b-list">`
        + (it.bullets||[]).map((b,i)=>`<div class="b-row${bulletShown(it.id,b)?'':' off'}"><input type="checkbox" class="chk" data-bv="${i}"${bulletShown(it.id,b)?' checked':''} title="Show in this version"><textarea data-b="${i}" rows="2" placeholder="Achievement, with a number if you can…">${esc(b.t)}</textarea><div class="b-tools"><button class="mini" data-act="b-up" data-i="${i}" title="Move up" aria-label="Move up">${ICON_UP}</button><button class="mini" data-act="b-down" data-i="${i}" title="Move down" aria-label="Move down">${ICON_DOWN}</button><button class="mini del" data-act="b-del" data-i="${i}" title="Delete bullet" aria-label="Delete bullet">${ICON_X}</button></div></div>`).join('')
        + `</div><button class="addline" data-act="b-add">+ Add bullet</button>`;
    }
    body += `<p class="hint">Wrap text in <code>**double stars**</code> to make it bold.</p>`;
    foot = `<button class="btn ${placed?'':'primary'}" data-act="ed-toggle">${placed?'Remove from CV':'Add to CV'}</button><span class="grow"></span><button class="btn" data-act="ed-dup" title="Make a variant of this block">Duplicate</button><button class="btn danger" data-act="ed-del">Delete</button>`;
  } else if (e.kind==='sec'){
    const sec = secById(e.id); color = sec.color; chip = 'Section'; title = 'Edit section';
    body = fld('stitle','Section title',sec.title)
      + `<label class="checkline"><input type="checkbox" class="chk" data-sf="hideHeading"${sec.hideHeading?' checked':''}> Hide heading on the CV</label>`;
    foot = `<button class="btn" data-act="additem" data-id="${sec.id}">+ New block</button><span class="grow"></span><button class="btn danger" data-act="sec-del">Delete section</button>`;
  } else if (e.kind==='header'){
    const h = state.header; chip = 'Header'; title = 'Edit header';
    body = fld('h-name','Name',h.name) + fld('h-location','Location',h.location)
      + `<span class="ed-label">Contact line</span>` + h.contacts.map((c,i)=>`<div class="ct-row"><input type="text" data-ct="${i}" data-cf="t" value="${esc(c.t)}" placeholder="Text"><input type="text" data-ct="${i}" data-cf="u" value="${esc(c.u)}" placeholder="Link (optional)"><button class="mini del" data-act="ct-del" data-i="${i}" title="Remove contact" aria-label="Remove contact">${ICON_X}</button></div>`).join('')
      + `<button class="addline" data-act="ct-add">+ Add contact</button>`;
    foot = `<span class="grow"></span><button class="btn" data-act="ed-close">Done</button>`;
  } else if (e.kind==='newsec'){
    chip = 'New'; title = 'New section';
    body = `<div class="fld"><label>Section title</label><input type="text" id="ns-title" placeholder="e.g. Leadership, Awards, Publications"></div>
      <div class="fld"><label>Block style</label><select id="ns-kind"><option value="entries">Entries — title, date, bullets (like Work Experience)</option><option value="skills">Groups — label + list (like Skills)</option><option value="text">Paragraph — free text (like a summary)</option></select></div>`;
    foot = `<span class="grow"></span><button class="btn" data-act="ed-close">Cancel</button><button class="btn primary" data-act="sec-create">Create section</button>`;
  }
  editor.style.setProperty('--c',color);
  editor.innerHTML = `<div class="ed-head"><span class="ed-chip">${esc(chip)}</span><h3>${title}</h3><button class="mini" data-act="ed-close" title="Close (Esc)" aria-label="Close">${ICON_X}</button></div><div class="ed-body">${body}</div><div class="ed-foot">${foot}</div>`;
  editor.querySelectorAll('textarea').forEach(autosize);
}
function autosize(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px'; }

let typingPushed = false, liveT = 0;
editor.addEventListener('focusin', ()=>{ typingPushed = false; });
function live(){ cancelAnimationFrame(liveT); liveT = requestAnimationFrame(()=>{ renderCV(); fit(); markEditing(); renderLibrary(); markEditing(); save(); }); }
editor.addEventListener('input', ev=>{
  const t = ev.target, e = ui.editing; if(!e) return;
  if (t.tagName==='TEXTAREA') autosize(t);
  if (e.kind==='newsec') return;
  if (!typingPushed || t.type==='checkbox'){ pushHistory(); typingPushed = t.type!=='checkbox'; }
  if (e.kind==='item'){
    const it = state.items[e.id];
    if (t.dataset.f) it[t.dataset.f] = t.value;
    else if (t.dataset.b!=null) it.bullets[+t.dataset.b].t = t.value;
    else if (t.dataset.bv!=null){ toggleHidden(it.id,'b',it.bullets[+t.dataset.bv].id,t.checked); t.closest('.b-row').classList.toggle('off',!t.checked); sfx.click(); typingPushed=false; }
    else if (t.dataset.dshow!=null){ toggleHidden(it.id,'d',null,t.checked); sfx.click(); typingPushed=false; }
  } else if (e.kind==='sec'){
    const sec = secById(e.id);
    if (t.dataset.f==='stitle') sec.title = t.value;
    if (t.dataset.sf==='hideHeading'){ sec.hideHeading = t.checked; sfx.click(); typingPushed=false; }
  } else if (e.kind==='header'){
    const h = state.header;
    if (t.dataset.f==='h-name') h.name = t.value;
    if (t.dataset.f==='h-location') h.location = t.value;
    if (t.dataset.ct!=null) h.contacts[+t.dataset.ct][t.dataset.cf] = t.value;
  }
  live();
});

/* ================= click actions ================= */
const act = {
  rmitem: el=>removeFromCV(el.dataset.id),
  rmsec: el=>{ pushHistory(); state.cv = state.cv.filter(s=>s.sec!==el.dataset.id); renderAll(true); sfx.remove(); },
  toggle: el=>{ const id=el.dataset.id; isPlaced(id) ? removeFromCV(id) : addToCV(id); },
  collapse: el=>{ const id=el.dataset.id; ui.collapsed[id]=!ui.collapsed[id]; libList.querySelector(`[data-libsec="${id}"]`).classList.toggle('collapsed',ui.collapsed[id]); },
  additem: el=>newItem(el.dataset.id),
  editsec: el=>{ openEditor('sec',el.dataset.id); },
  newsec: ()=>{ openEditor('newsec'); setTimeout(()=>$('#ns-title')?.focus(),50); },
  'sec-create': ()=>{
    const title = $('#ns-title').value.trim() || 'New Section', kind = $('#ns-kind').value;
    pushHistory();
    const id = 's-'+uid();
    state.sections.push({id,title,kind,color:PALETTE[state.sections.length % PALETTE.length],hideHeading:false});
    state.libOrder[id] = [];
    renderAll(false); sfx.pop();
    newItem(id);
  },
  'sec-color': el=>{ pushHistory(); secById(ui.editing.id).color = el.dataset.c; buildEditor(); renderAll(false); sfx.click(); },
  'sec-del': ()=>{
    const sec = secById(ui.editing.id), n = (state.libOrder[sec.id]||[]).length;
    if (!confirm(`Delete the "${sec.title}" section${n?` and its ${n} block${n>1?'s':''}`:''}? You can undo this.`)) return;
    pushHistory();
    (state.libOrder[sec.id]||[]).forEach(id=>delete state.items[id]);
    delete state.libOrder[sec.id];
    state.sections = state.sections.filter(s=>s.id!==sec.id);
    state.cv = state.cv.filter(s=>s.sec!==sec.id);
    closeEditor(); renderAll(true); sfx.remove();
  },
  'ed-close': ()=>{ closeEditor(); },
  'ed-toggle': ()=>{ const id=ui.editing.id; isPlaced(id)?removeFromCV(id):addToCV(id); buildEditor(); markEditing(); },
  'ed-dup': ()=>{
    const src = state.items[ui.editing.id], id = src.sec+'-'+uid();
    pushHistory();
    state.items[id] = JSON.parse(JSON.stringify({...src,id}));
    const lo = state.libOrder[src.sec]; lo.splice(lo.indexOf(src.id)+1,0,id);
    renderAll(false); openEditor('item',id);
    libList.querySelector(`[data-libitem="${id}"]`)?.classList.add('flash');
    toast('Duplicated — edit this variant freely'); sfx.pop();
  },
  'ed-del': ()=>{
    const it = state.items[ui.editing.id];
    if (!confirm(`Delete "${it.title || 'this block'}" from your library? You can undo this.`)) return;
    pushHistory();
    removeItemFromCV(it.id);
    state.libOrder[it.sec] = state.libOrder[it.sec].filter(x=>x!==it.id);
    delete state.items[it.id];
    closeEditor(); renderAll(true); sfx.remove();
  },
  'b-add': ()=>{ pushHistory(); const it=state.items[ui.editing.id]; (it.bullets ||= []).push({id:uid(),t:''}); buildEditor(); live(); const ts=editor.querySelectorAll('[data-b]'); ts[ts.length-1]?.focus(); sfx.pop(); },
  'b-del': el=>{ pushHistory(); state.items[ui.editing.id].bullets.splice(+el.dataset.i,1); buildEditor(); live(); sfx.remove(); },
  'b-up': el=>moveBullet(+el.dataset.i,-1),
  'b-down': el=>moveBullet(+el.dataset.i,1),
  'ct-add': ()=>{ pushHistory(); state.header.contacts.push({t:'',u:''}); buildEditor(); live(); sfx.pop(); },
  'ct-del': el=>{ pushHistory(); state.header.contacts.splice(+el.dataset.i,1); buildEditor(); live(); sfx.remove(); },
  undo: ()=>{ undo(); sfx.click(); }, redo: ()=>{ redo(); sfx.click(); },
  more: el=>togglePop('#morePop',el),
  tpl: el=>{ $('#tplList').innerHTML = Object.entries(TEMPLATES).map(([id,t])=>`<button class="pop-item tpl-item${id===tplId()?' on':''}" data-act="tpl-set" data-id="${id}"><span class="tpl-check">${id===tplId()?ICON_CHECK:''}</span><span><b>${t.name}</b><small>${t.desc}</small></span></button>`).join(''); togglePop('#tplPop',el); },
  'tpl-set': el=>{ closePops(); if (el.dataset.id===tplId()) return; pushHistory(); activeTab().template = el.dataset.id; renderAll(true); sfx.click(); },
  autofit: ()=>{ state.settings.autofit=!state.settings.autofit; syncChrome(); renderAll(true); sfx.click(); },
  sound: ()=>{ setSound(!soundOn); syncChrome(); sfx.click(); },
  zoomin: ()=>{ state.settings.zoom=clamp(+(state.settings.zoom+.1).toFixed(2),.5,2); sizeWrap(); save(); },
  zoomout: ()=>{ state.settings.zoom=clamp(+(state.settings.zoom-.1).toFixed(2),.5,2); sizeWrap(); save(); },
  export: exportPDF,
  'tab-switch': el=>switchTab(el.dataset.id),
  'tab-new': ()=>{
    syncTab(); pushHistory();
    const n = state.tabs.length+1, t = {id:uid(), name:'Version '+n, cv:JSON.parse(JSON.stringify(state.cv)), hidden:JSON.parse(JSON.stringify(activeTab().hidden||{})), template:tplId()};
    state.tabs.push(t); state.activeTab = t.id; state.cv = t.cv;
    renderAll(true); sfx.pop();
    $(`#tabs .tab[data-id="${t.id}"]`)?.classList.add('pop');
    renameTab(t.id);
  },
  'tab-close': el=>{
    const id = el.dataset.id, t = state.tabs.find(x=>x.id===id);
    if (!t || state.tabs.length===1) return;
    if (!confirm(`Close "${t.name}"? Only this layout is removed; every block stays in your library. You can undo this.`)) return;
    syncTab(); pushHistory();
    const i = state.tabs.indexOf(t);
    state.tabs.splice(i,1);
    if (state.activeTab===id){ state.activeTab = state.tabs[Math.max(0,i-1)].id; }
    state.cv = activeTab().cv;
    renderAll(true); sfx.remove();
  },
  backup: ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'blokk-backup.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000); closePops();
  },
  restore: ()=>{ $('#restoreFile').click(); closePops(); },
  blank: ()=>{
    if (!confirm('Start a blank CV? Every block in your library will be cleared, and you will have a single empty layout. You can undo this.')) return;
    pushHistory();
    state.header = {name:'YOUR NAME',location:'City, Country',contacts:[{t:'you@email.com',u:''},{t:'+00 000 000 0000',u:''},{t:'linkedin.com/in/you',u:''}]};
    state.items = {};
    state.sections.forEach(s=>state.libOrder[s.id]=[]);
    state.cv = state.sections.filter(s=>s.kind!=='text').map(s=>({sec:s.id,items:[]}));
    state.tabs = [{id:uid(), name:'Main', cv:state.cv}]; state.activeTab = state.tabs[0].id;
    closeEditor(); closePops(); renderAll(true); sfx.snap(); toast('Blank CV ready — click + on a section to add blocks');
  },
  reset: ()=>{
    if (!confirm('Reset everything to the starter template? Your library and version tabs will be replaced. You can undo this.')) return;
    pushHistory(); state = defaults(); migrateTabs(); closeEditor(); closePops(); syncChrome(); renderAll(true); sfx.snap();
  }
};
function moveBullet(i,dir){
  const b = state.items[ui.editing.id].bullets, j = i+dir; if(j<0||j>=b.length) return;
  pushHistory(); [b[i],b[j]] = [b[j],b[i]]; buildEditor(); live(); sfx.tick();
}

document.addEventListener('click', e=>{
  if (e.target.closest('#page a')) e.preventDefault();
  if (suppressClick) return;
  if (!e.target.closest('.popover,#moreBtn,#tplBtn')) closePops();
  const a = e.target.closest('[data-act]');
  if (a && act[a.dataset.act]){ act[a.dataset.act](a,e); return; }
  const c = e.target.closest('[data-click]');
  if (c){ const [k,id] = c.dataset.click.split(':'); openEditor(k==='header'?'header':k, id); }
});
document.addEventListener('dblclick', e=>{ const t = e.target.closest('#tabs .tab'); if (t) renameTab(t.dataset.id); });
document.addEventListener('keydown', e=>{
  const typing = e.target.closest('input,textarea,select');
  const mod = e.metaKey||e.ctrlKey;
  if (mod && e.key.toLowerCase()==='p'){ e.preventDefault(); exportPDF(); return; }
  if (mod && e.key.toLowerCase()==='z' && !typing){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if (mod && e.key.toLowerCase()==='y' && !typing){ e.preventDefault(); redo(); return; }
  if (e.key==='Escape'){ if(drag) endDrag(true); else if($('.popover.open')) closePops(true); else if(ui.editing) closeEditor(true); }
  if (e.key==='Enter' && e.target.id==='ns-title') act['sec-create']();
});
$('#restoreFile').addEventListener('change', async ev=>{
  const f = ev.target.files[0]; if(!f) return;
  try{ const s = JSON.parse(await f.text()); if(!s.sections||!s.items) throw 0; pushHistory(); state = s; state.settings ||= {autofit:true,sound:true,zoom:1}; migrateTabs(); closeEditor(); syncChrome(); renderAll(true); toast('Backup restored'); }
  catch(_){ toast('That file is not a Blokk backup'); }
  ev.target.value='';
});

/* ================= chrome ================= */
function togglePop(sel,trigger){
  const p=$(sel), open=!p.classList.contains('open'); closePops();
  if(!open) return;
  const r=(trigger.closest('.tgroup')||trigger).getBoundingClientRect();
  p.style.right=Math.max(12,innerWidth-r.right)+'px'; p.style.top=(r.bottom+8)+'px';
  p.classList.add('open');
}
function closePops(instant){ document.querySelectorAll('.popover.open').forEach(p=>{ if(instant){ p.style.transition='none'; requestAnimationFrame(()=>requestAnimationFrame(()=>p.style.transition='')); } p.classList.remove('open'); }); }
function syncChrome(){
  $('#fitSwitch').classList.toggle('on', state.settings.autofit);
  $('#soundBtn').innerHTML = soundOn ? SOUND_ON : SOUND_OFF; $('#soundBtn').setAttribute('aria-pressed', soundOn);
}
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }
async function exportPDF(){
  closePops();
  const name = (state.header.name||'CV').replace(/\*\*/g,'').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
  document.title = name;
  if (window.cvApp){
    try{ const out = await window.cvApp.exportPDF(name); if(out){ toast('PDF saved'); sfx.exported(); } }
    catch(e){ toast('Could not save the PDF'); }
    return;
  }
  toast('Choose “Save as PDF” in the print dialog');
  setTimeout(()=>window.print(), 250);
}

if (window.cvApp) document.body.classList.add('is-app','plat-'+window.cvApp.platform);
new ResizeObserver(()=>sizeWrap()).observe(stage);
migrateTabs();
syncChrome(); updateUndo();
renderAll(false);
document.fonts?.ready.then(()=>fit());
</script>
