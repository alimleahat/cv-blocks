<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Blokk</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%27100 100 824 824%27%3E%3Crect x=%27100%27 y=%27100%27 width=%27824%27 height=%27824%27 rx=%27186%27 fill=%27%231d1d1f%27/%3E%3Crect x=%27236%27 y=%27560%27 width=%27552%27 height=%27200%27 rx=%2740%27 fill=%27%23f4f3ef%27/%3E%3Crect x=%27236%27 y=%27330%27 width=%27260%27 height=%27200%27 rx=%2740%27 fill=%27%23f4f3ef%27/%3E%3Crect x=%27528%27 y=%27236%27 width=%27260%27 height=%27200%27 rx=%2740%27 fill=%27%23f4f3ef%27 transform=%27rotate(8 658 336)%27/%3E%3C/svg%3E">
<style>
:root{
  --ink:#1d1d1f; --ink-2:#3a3a3c; --muted:#6e6e73; --faint:#8e8e93;
  --hair:rgba(0,0,0,.1); --hair-soft:rgba(0,0,0,.06);
  --bar:#f6f6f8; --side:#f2f2f4; --panel:#fbfbfc; --field:#fff;
  --canvas:#eceef1; --grid:#e0e3e7; --grid-major:#d6dae0;
  --accent:#007aff; --accent-fill:#0068d6; --accent-hover:#005bbf; --accent-soft:rgba(0,122,255,.12);
  --ok:#28a745; --warn:#e8890c; --danger:#d93025;
  --side-w:280px; --ed-w:340px;
  /* liquid glass: only for layers that float over the canvas */
  --glass:rgba(255,255,255,.6);
  --blur:blur(18px) saturate(180%);
  --shadow-glass:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 .5px rgba(255,255,255,.55),0 0 0 .5px rgba(0,0,0,.09),0 8px 24px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --ease:cubic-bezier(.23,1,.32,1); --spring:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif;color:var(--ink);font-size:13px;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;overflow:hidden;background:var(--bar)}
::selection{background:rgba(0,122,255,.22)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-columns:var(--side-w) 1fr;grid-template-rows:52px 1fr;height:100vh}

/* themed scrollbars on Windows only; macOS keeps its native overlay scrollbars */
body.plat-win32 ::-webkit-scrollbar{width:8px;height:8px}
body.plat-win32 ::-webkit-scrollbar-track{background:transparent}
body.plat-win32 ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:8px;border:2px solid transparent;background-clip:content-box}

/* ---------- liquid glass material ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow-glass);isolation:isolate}

/* ---------- toolbar ---------- */
.topbar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:6px;padding:0 12px 0 16px;z-index:30;position:relative;background:var(--bar);border-bottom:1px solid var(--hair);-webkit-app-region:drag}
.topbar>*{-webkit-app-region:no-drag}
body.plat-darwin .topbar{padding-left:86px}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;letter-spacing:-.015em;flex:1;min-width:0;align-self:stretch;-webkit-app-region:drag;user-select:none}
.logo{width:24px;height:24px;flex:none;border-radius:6px;box-shadow:0 0 0 .5px rgba(0,0,0,.14)}
.brand small{font-weight:450;color:var(--muted);font-size:12px}
.tgroup{display:flex;align-items:center;gap:1px;position:relative}
.tsep{width:1px;height:18px;background:var(--hair);margin:0 6px}
.btn{height:28px;padding:0 10px;border-radius:7px;border:0;background:transparent;font-weight:500;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .16s var(--ease);white-space:nowrap;user-select:none;color:var(--ink-2)}
.btn:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.btn:active{transform:scale(.97);background:rgba(0,0,0,.1)}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn.primary{background:var(--accent-fill);color:#fff;font-weight:600;box-shadow:inset 0 .5px 0 rgba(255,255,255,.25),0 .5px 1.5px rgba(0,0,0,.2)}
.btn.primary:hover{background:var(--accent-hover);color:#fff}
.topbar .btn.primary{margin-left:6px;padding:0 12px}
.btn:disabled{opacity:.3;pointer-events:none}
.btn svg{width:16px;height:16px;flex:none}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:12.5px;cursor:pointer;user-select:none;padding:0 10px 0 8px;height:28px;border-radius:7px;transition:none;color:var(--ink-2)}
.switch:hover{background:rgba(0,0,0,.06)}
.switch .track{width:28px;height:16px;border-radius:16px;background:rgba(0,0,0,.16);position:relative;transition:none}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.05);transition:transform .18s var(--ease)}
.switch.on .track{background:var(--accent)}
.switch.on .track::after{transform:translateX(12px)}
.zoomval{font-variant-numeric:tabular-nums;font-weight:500;font-size:12px;color:var(--ink-2);width:42px;text-align:center}

.popover{position:absolute;top:58px;background:rgba(250,250,252,.72);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-radius:12px;padding:6px;min-width:250px;max-width:320px;opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .12s var(--ease),transform .12s var(--ease);z-index:50;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 0 .5px rgba(0,0,0,.14),0 12px 36px rgba(0,0,0,.16)}
.popover.open{opacity:1;transform:none;pointer-events:auto;transition:opacity .18s var(--ease),transform .18s var(--ease)}
.pop-title{font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px 4px}
.pop-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:450;color:var(--ink)}
.pop-item:hover{background:var(--accent-fill);color:#fff}
.pop-item.danger{color:var(--danger)}
.pop-item.danger:hover{background:var(--danger);color:#fff}
.tpl-item{align-items:flex-start;padding:7px 10px}
.tpl-item b{display:block;font-weight:600}
.tpl-item small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.tpl-item:hover small{color:rgba(255,255,255,.85)}
.tpl-check{width:14px;flex:none;margin-top:2px}.tpl-check svg{width:14px;height:14px;display:block}
.pop-sep{height:1px;background:var(--hair-soft);margin:5px 8px}
.pop-item .x{margin-left:auto;opacity:.5;border:0;background:none;cursor:pointer;padding:2px 7px;border-radius:999px;color:inherit}
.pop-item .x:hover{opacity:1}
.pop-empty{color:var(--muted);padding:4px 10px 10px;font-size:12px;line-height:1.5}
.pop-row{display:flex;gap:6px;padding:8px 2px 2px;border-top:1px solid var(--hair-soft);margin-top:6px}
.pop-row input{flex:1}

/* ---------- library (sidebar) ---------- */
#library{grid-column:1;grid-row:2;overflow:auto;padding:14px 10px 40px;position:relative;z-index:5;background:var(--side);border-right:1px solid var(--hair)}
.lib-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 8px 8px}
.lib-head h2{font-size:15px;font-weight:650;letter-spacing:-.02em;margin:0}
.lib-head span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lib-sec{margin:10px 0 2px}.lib-sec:first-child{margin-top:0}
.lib-sec-head{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;cursor:grab;user-select:none;font-weight:600;font-size:11px;letter-spacing:.02em;color:var(--muted);border-radius:6px;touch-action:none;transition:none}
.lib-sec-head:hover{background:rgba(0,0,0,.045)}
.lib-sec-head .grip{position:absolute;left:0;color:#b4b4ba;display:flex;opacity:0;transition:opacity .15s}
.lib-sec-head:hover .grip{opacity:1}
.lib-sec-head .dot{display:none}
.ls-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls-count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500;min-width:26px;text-align:right}
.mini{width:24px;height:24px;border-radius:6px;border:0;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center;font-size:14px;transition:transform .16s var(--ease)}
.mini:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.mini:active{transform:scale(.97)}
.mini svg{width:14px;height:14px}
.chev{color:var(--faint);transition:transform .2s var(--ease);display:flex;width:16px;justify-content:center}
.lib-sec.collapsed .chev{transform:rotate(-90deg)}
.lib-items-wrap{display:grid;grid-template-rows:1fr;transition:none}
.lib-sec.collapsed .lib-items-wrap{grid-template-rows:0fr}
.lib-items{overflow:hidden;min-height:0}
.lib-items-inner{padding:2px 0 4px;display:flex;flex-direction:column;gap:1px;transition:opacity .15s var(--ease),transform .15s var(--ease)}
.lib-sec.collapsed .lib-items-inner{opacity:0;transform:translateY(-4px)}
.lib-card{border-radius:7px;padding:6px 8px 6px 10px;cursor:grab;position:relative;display:flex;align-items:center;gap:8px;transition:opacity .2s,transform .2s var(--spring);user-select:none;touch-action:none}
.lib-card:hover{background:rgba(0,0,0,.045)}
.lib-card:active{transform:scale(.99)}
.lc-text{flex:1;min-width:0}
.lc-title{font-weight:500;font-size:12.5px;line-height:1.3;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-meta{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-title b,.lc-meta b{font-weight:inherit}
.lc-badge{flex:none;height:22px;min-width:22px;padding:0 8px;border-radius:6px;border:0;background:#fff;font-size:11px;font-weight:600;cursor:pointer;color:var(--accent-fill);box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 .5px 1px rgba(0,0,0,.06);transition:transform .16s var(--ease)}
.lc-badge:hover{background:var(--accent-fill);color:#fff}
.lc-badge:active{transform:scale(.97)}
.lib-card.placed .lc-badge{background:transparent;box-shadow:none;padding:0;width:22px;color:var(--faint);display:grid;place-items:center}
.lib-card.placed .lc-badge svg{width:14px;height:14px}
.lib-card.placed .lc-badge:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.lib-card.lifting,.lib-sec-head.lifting{opacity:.3}
.lib-card.editing{background:var(--accent-soft)}
.lib-card.editing .lc-title{color:var(--accent-fill);font-weight:600}
.lib-card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(0,122,255,.2);opacity:0;pointer-events:none}
.lib-card.flash::after{animation:tint-fade .4s var(--ease)}
@keyframes tint-fade{from{opacity:1}to{opacity:0}}
.lib-empty{font-size:12px;color:var(--muted);padding:6px 10px}
.lib-new{width:100%;height:32px;margin-top:6px;border:0;border-radius:7px;background:transparent;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink-2);font-weight:500;cursor:pointer;transition:transform .16s var(--ease)}
.lib-new:hover{background:rgba(0,0,0,.045);color:var(--ink)}
.lib-new:active{transform:scale(.97)}
.lib-tip{margin:14px 8px 0;font-size:11.5px;color:var(--muted);line-height:1.55}
.lib-tip kbd{font-family:inherit;font-size:10.5px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 1px 0 rgba(0,0,0,.08);border-radius:4px;padding:0 5px}
.remove-zone{position:fixed;left:0;top:52px;width:var(--side-w);bottom:0;z-index:40;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s;background:rgba(242,242,244,.7);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 0 0 2px rgba(217,48,37,.4)}
.remove-zone div{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--danger);font-weight:600;transform:scale(.95);transition:transform .2s var(--ease)}
.remove-zone svg{width:28px;height:28px}
body.drag-from-cv .remove-zone.show{opacity:1}
.remove-zone.show div{transform:scale(1)}

/* ---------- canvas ---------- */
#main{position:relative;overflow:hidden;grid-column:2;grid-row:2;z-index:0}
#stage{position:absolute;inset:0;overflow:auto;padding:64px 48px 78px;transition:none;
  background-color:var(--canvas);background-attachment:local;
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px,64px 64px,16px 16px,16px 16px;background-position:-1px -1px}
#main.editor-open #stage{padding-right:calc(var(--ed-w) + 48px)}
#pageWrap{margin:0 auto;position:relative}
#page{position:relative;transform-origin:0 0;width:210mm;min-height:297mm;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06),0 12px 32px rgba(20,30,50,.1);border-radius:2px;transition:none}
#page.drop-page{box-shadow:0 0 0 2px var(--accent),0 12px 32px rgba(20,30,50,.1)}
.cv-inner{display:flow-root}
.page-break{position:absolute;left:-14px;right:-14px;height:0;border-top:1.5px dashed var(--warn);pointer-events:none}
.page-break span{position:absolute;right:0;top:-24px;font:600 10.5px -apple-system,sans-serif;color:#1d1d1f;background:rgba(255,255,255,.85);box-shadow:0 0 0 .5px rgba(0,0,0,.12);padding:3px 9px;border-radius:999px}

/* ---------- version tabs (glass, floating over the canvas) ---------- */
.tabs{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;z-index:12;max-width:calc(100% - 48px);overflow-x:auto;scrollbar-width:none;transition:none}
#main.editor-open .tabs{left:calc((100% - var(--ed-w))/2);max-width:calc(100% - var(--ed-w) - 48px)}
.tab{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 12px;border:0;border-radius:999px;background:transparent;font-weight:500;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:transform .16s var(--ease);user-select:none}
.tab:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.tab:active{transform:scale(.97)}
.tab.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 1px 4px rgba(0,0,0,.1)}
.tab-x{width:18px;height:18px;border-radius:999px;display:grid;place-items:center;font-size:13px;line-height:1;color:var(--muted);opacity:0;transition:opacity .15s}
.tab:hover .tab-x,.tab.active .tab-x{opacity:1}
.tab-x:hover{background:rgba(0,0,0,.08);color:var(--ink)}
.tabs.single .tab-x{display:none}
.tabs.single .tab{padding-right:12px}
.tab input{width:120px;height:22px;padding:0 8px;font-size:12.5px;border-radius:999px}
.tab-add{width:26px;height:26px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-size:16px;cursor:pointer;flex:none;transition:transform .16s var(--ease)}
.tab-add:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.tab-add:active{transform:scale(.97)}
.tab.pop{animation:tabpop .2s var(--ease)}
@keyframes tabpop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}

/* ---------- fit status bar (translucent, the page scrolls under it, never covered at rest) ---------- */
.fit-pill{position:absolute;left:0;right:0;bottom:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:12px;z-index:10;white-space:nowrap;transition:none;
  background:rgba(246,246,248,.9);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 var(--hair)}
#main.editor-open .fit-pill{right:var(--ed-w)}
.fit-pill .ind{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;color:#fff}.fit-pill .ind svg{width:10px;height:10px;stroke-width:3.2}
.fit-pill.ok .ind{background:var(--ok)}
.fit-pill.warn .ind{background:var(--warn)}
.fit-pill.warn{color:#9a5a00}
.fit-pill .sub{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.fit-pill.changed .ind,.fit-pill.changed #fitText{animation:fade-in .15s var(--ease)}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ---------- CV templates ----------
   One set of markup, four looks. #page (and the drag copy) carries "cv tpl-<id>".
   Shared structure first, then each template's typography. */
@font-face{font-family:"CMU Serif";font-style:normal;font-weight:400;src:url("fonts/cmu-serif-500-roman.woff2") format("woff2")}
@font-face{font-family:"CMU Serif";font-style:italic;font-weight:400;src:url("fonts/cmu-serif-500-italic.woff2") format("woff2")}
@font-face{font-family:"CMU Serif";font-style:normal;font-weight:700;src:url("fonts/cmu-serif-700-roman.woff2") format("woff2")}
@font-face{font-family:"CMU Serif";font-style:italic;font-weight:700;src:url("fonts/cmu-serif-700-italic.woff2") format("woff2")}
@font-face{font-family:"Lato";font-style:normal;font-weight:300;src:url("fonts/lato-300-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-style:normal;font-weight:400;src:url("fonts/lato-400-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-style:italic;font-weight:400;src:url("fonts/lato-400-italic.woff2") format("woff2")}
@font-face{font-family:"Lato";font-style:normal;font-weight:700;src:url("fonts/lato-700-normal.woff2") format("woff2")}
@font-face{font-family:"Lato";font-style:italic;font-weight:700;src:url("fonts/lato-700-italic.woff2") format("woff2")}
.cv{--fs:1;--sp:1;text-align:left}
.cv a{color:inherit;text-decoration:none}
.cv b{font-weight:bold}
.cv-header{border-radius:4px;cursor:pointer;position:relative}
.cv-sec{position:relative}
.sec-h{cursor:grab}
.cv-item{position:relative;border-radius:3px}
.e-row{display:flex;justify-content:space-between;align-items:baseline;gap:8pt}
.e-left{min-width:0}
.e-date,.e-place{white-space:nowrap;flex:none}
.e-title .lnk{display:inline-block;margin-left:1.5pt}
.e-bullets{list-style:none;margin:0;padding:0}
.e-bullets li{position:relative}
.e-tech,.e-techline.dup{display:none}

/* Blue Accent: sans serif, blue headings and dates */
#page.tpl-blue{padding:19pt 22pt 14pt}
.tpl-blue.cv{font-family:Tahoma,Verdana,"DejaVu Sans",sans-serif;color:#333;font-size:calc(9pt*var(--fs));line-height:1.22;-webkit-font-smoothing:auto}
.tpl-blue .cv-header{text-align:center;padding-bottom:calc(3pt*var(--sp))}
.tpl-blue .cv-name{font-size:calc(24pt*var(--fs));font-weight:bold;letter-spacing:1.2pt;line-height:1.2;color:#333}
.tpl-blue .cv-loc{font-size:calc(9pt*var(--fs));color:#555;margin-top:calc(4pt*var(--sp));line-height:1.25}
.tpl-blue .cv-contacts{font-size:calc(9pt*var(--fs));color:#555;margin-top:calc(3pt*var(--sp));line-height:1.25}
.tpl-blue .sep::before{content:" \2022  "}
.tpl-blue .cv-sec{margin-top:calc(6pt*var(--sp))}
.tpl-blue .sec-h{font-size:calc(12pt*var(--fs));font-weight:bold;color:#667eea;text-transform:uppercase;line-height:1.2;padding-bottom:2.5pt;border-bottom:.75pt solid #667eea;margin-bottom:calc(5pt*var(--sp));letter-spacing:.15pt}
.tpl-blue .kind-entries .sec-body>.cv-item+.cv-item,.tpl-blue .kind-text .sec-body>.cv-item+.cv-item{margin-top:calc(6pt*var(--sp))}
.tpl-blue .e-title{font-size:calc(11pt*var(--fs));font-weight:bold;color:#333;line-height:1.3}
.tpl-blue .e-title .lnk{width:calc(10pt*var(--fs));height:calc(10pt*var(--fs));vertical-align:.25em}
.tpl-blue .e-note{font-size:calc(9pt*var(--fs));font-weight:normal;color:#333}
.tpl-blue .dash::before{content:" - ";font-size:calc(11pt*var(--fs))}
.tpl-blue .e-date{font-size:calc(9pt*var(--fs));color:#667eea}

.tpl-blue .e-bullets li{font-size:calc(9pt*var(--fs));line-height:1.22;color:#333}
.tpl-blue .e-bullets li::before{content:"\2022";position:absolute;left:-8.5pt;color:#667eea;font-weight:bold}
.tpl-blue .kind-skills .sec-body{display:flex;flex-wrap:wrap;column-gap:8pt;row-gap:calc(5pt*var(--sp))}
.tpl-blue .sk-line{display:flex;flex-direction:column}
.tpl-blue .sk-colon{display:none}

/* Classic: LaTeX look, after Jake Gutierrez's "Jake's Resume" (MIT) */
#page.tpl-classic{padding:28pt 36pt 26pt}
.tpl-classic.cv{font-family:"CMU Serif","Latin Modern Roman","Computer Modern",Georgia,serif;color:#000;font-size:calc(10pt*var(--fs));line-height:1.2;font-kerning:normal}
.tpl-classic .cv-header{text-align:center;padding-bottom:calc(2pt*var(--sp))}
.tpl-classic .cv-name{font-size:calc(24.5pt*var(--fs));font-weight:bold;font-variant:small-caps;line-height:1.1;letter-spacing:.2pt}
.tpl-classic .cv-loc{font-size:calc(10pt*var(--fs));margin-top:calc(3pt*var(--sp))}
.tpl-classic .cv-contacts{font-size:calc(10pt*var(--fs));margin-top:calc(2pt*var(--sp))}
.tpl-classic .cv-contacts a{text-decoration:underline;text-decoration-thickness:.4pt;text-underline-offset:1.5pt}
.tpl-classic .sep{margin:0 3.5pt}.tpl-classic .sep::before{content:"|"}
.tpl-classic .cv-sec{margin-top:calc(7pt*var(--sp))}

.tpl-classic .sec-body{padding:0 6pt 0 11pt}
.tpl-classic .kind-entries .sec-body>.cv-item+.cv-item,.tpl-classic .kind-text .sec-body>.cv-item+.cv-item{margin-top:calc(5pt*var(--sp))}
.tpl-classic .e-row{gap:10pt}
.tpl-classic .e-title{font-weight:bold;font-size:calc(11pt*var(--fs))}
.tpl-classic .e-title .lnk{width:calc(8.5pt*var(--fs));height:calc(8.5pt*var(--fs));margin-left:2pt;vertical-align:.1em}
.tpl-classic .e-note{font-size:calc(11pt*var(--fs))}
.tpl-classic .dash::before{content:", "}
.tpl-classic .e-tech{display:inline;font-style:italic;font-size:calc(10pt*var(--fs))}
.tpl-classic .e-tech .bar{font-style:normal;margin:0 3pt}
.tpl-classic .e-date{font-size:calc(11pt*var(--fs))}
.tpl-classic .e-row2{font-style:italic;font-size:calc(10pt*var(--fs));margin-top:calc(.5pt*var(--sp))}
.tpl-classic .e-techline:not(.dup){display:block;font-style:italic;font-size:calc(10pt*var(--fs));margin-top:calc(1pt*var(--sp))}
.tpl-classic .e-detail{font-size:calc(10pt*var(--fs));margin-top:calc(2pt*var(--sp))}
.tpl-classic .e-detail .lbl{font-weight:bold}
.tpl-classic .e-bullets{margin-top:calc(2.5pt*var(--sp));padding-left:17pt}
.tpl-classic .e-bullets li{font-size:calc(10pt*var(--fs));line-height:1.22}
.tpl-classic .e-bullets li+li{margin-top:calc(.5pt*var(--sp))}
.tpl-classic .e-bullets li::before{content:"\2022";position:absolute;left:-10pt;top:-.05em;font-size:1.05em}
.tpl-classic .kind-skills .sec-body>.cv-item+.cv-item{margin-top:calc(1pt*var(--sp))}
.tpl-classic .sk-line{font-size:calc(10pt*var(--fs));line-height:1.3}
.tpl-classic .sk-title{font-weight:bold}
.tpl-classic .t-para{margin:0;font-size:calc(10pt*var(--fs));line-height:1.3}

/* Timeline: dates in a left column, after moderncv's "classic" style (LPPL 1.3c) */
#page.tpl-timeline{padding:30pt 34pt 24pt;--tl:var(--tl-col,92pt);--tl-c:#3873b3}
.tpl-timeline.cv{font-family:"Lato","Helvetica Neue",Arial,sans-serif;color:#3c3c3c;font-size:calc(9.5pt*var(--fs));line-height:1.28}
.tpl-timeline .cv-header{display:grid;grid-template-columns:1fr auto;column-gap:16pt;align-items:start;padding-bottom:calc(4pt*var(--sp))}
.tpl-timeline .cv-name{grid-column:1;font-size:calc(28pt*var(--fs));font-weight:300;color:var(--tl-c);line-height:1.08;letter-spacing:.2pt}
.tpl-timeline .cv-name .n2{font-weight:400;color:#3c3c3c}
.tpl-timeline .cv-loc{grid-column:1;font-size:calc(11pt*var(--fs));font-style:italic;color:#7a7a7a;margin-top:calc(2pt*var(--sp))}
.tpl-timeline .cv-contacts{grid-column:2;grid-row:1/span 2;text-align:right;font-size:calc(8.5pt*var(--fs));line-height:1.55;color:#555}
.tpl-timeline .sep{display:block;height:0}
.tpl-timeline .cv-sec{margin-top:calc(9pt*var(--sp))}
.tpl-timeline .sec-h{display:grid;grid-template-columns:var(--tl) 1fr;column-gap:10pt;align-items:center;font-size:calc(13pt*var(--fs));font-weight:400;color:var(--tl-c);line-height:1.2;margin-bottom:calc(4pt*var(--sp))}
.tpl-timeline .sec-h::before{content:"";height:5pt;background:var(--tl-c);opacity:.55;border-radius:1pt}
.tpl-timeline .kind-entries .sec-body>.cv-item+.cv-item,.tpl-timeline .kind-text .sec-body>.cv-item+.cv-item{margin-top:calc(5pt*var(--sp))}
.tpl-timeline .kind-entries .cv-item{display:grid;grid-template-columns:var(--tl) 1fr;column-gap:10pt;align-items:baseline}
.tpl-timeline .kind-entries .cv-item>*{grid-column:2}
.tpl-timeline .kind-entries .e-row:not(.e-row2){display:contents}
.tpl-timeline .kind-entries .e-left{grid-column:2;grid-row:1}
.tpl-timeline .kind-entries .e-date{grid-column:1;grid-row:1;text-align:right;white-space:normal;font-size:calc(8.5pt*var(--fs));color:#555}
.tpl-timeline .e-title{font-weight:700;font-size:calc(10pt*var(--fs))}
.tpl-timeline .e-title .lnk{width:calc(8.5pt*var(--fs));height:calc(8.5pt*var(--fs));vertical-align:.05em}
.tpl-timeline .dash::before{content:", "}
.tpl-timeline .e-note{color:#555}
.tpl-timeline .e-row2{display:block;font-size:calc(9.5pt*var(--fs))}
.tpl-timeline .e-sub{font-style:italic}
.tpl-timeline .e-place{color:#7a7a7a}
.tpl-timeline .e-sub+.e-place::before{content:", "}
.tpl-timeline .e-techline,.tpl-timeline .e-techline.dup{display:block;font-size:calc(8.5pt*var(--fs));font-style:italic;color:#7a7a7a;margin-top:calc(1pt*var(--sp))}
.tpl-timeline .e-detail{font-size:calc(9pt*var(--fs));margin-top:calc(2pt*var(--sp))}
.tpl-timeline .e-detail .lbl{font-weight:700}
.tpl-timeline .e-bullets{margin-top:calc(2pt*var(--sp));padding-left:11pt}
.tpl-timeline .e-bullets li{font-size:calc(9pt*var(--fs));line-height:1.28}
.tpl-timeline .e-bullets li::before{content:"\2022";position:absolute;left:-9pt;color:var(--tl-c)}
.tpl-timeline .kind-skills .sec-body>.cv-item+.cv-item{margin-top:calc(1.5pt*var(--sp))}
.tpl-timeline .sk-line{display:grid;grid-template-columns:var(--tl) 1fr;column-gap:10pt;font-size:calc(9pt*var(--fs))}
.tpl-timeline .sk-title{text-align:right;color:var(--tl-c)}
.tpl-timeline .sk-colon{display:none}
.tpl-timeline .kind-text .sec-body{padding-left:calc(var(--tl) + 10pt)}
.tpl-timeline .t-para{margin:0;font-size:calc(9.5pt*var(--fs));line-height:1.35}

/* Executive: traditional banking / consulting format */
#page.tpl-executive{padding:32pt 44pt 26pt}
.tpl-executive.cv{font-family:"Times New Roman",Times,"Liberation Serif",serif;color:#111;font-size:calc(10.5pt*var(--fs));line-height:1.22}
.tpl-executive .cv-header{text-align:center;padding-bottom:calc(2pt*var(--sp))}
.tpl-executive .cv-name{font-size:calc(24pt*var(--fs));font-variant:small-caps;letter-spacing:2.5pt;line-height:1.1}
.tpl-executive .cv-loc{font-size:calc(10.5pt*var(--fs));font-style:italic;margin-top:calc(2pt*var(--sp))}
.tpl-executive .cv-contacts{font-size:calc(10pt*var(--fs));margin-top:calc(2pt*var(--sp))}
.tpl-executive .sep{margin:0 6pt}.tpl-executive .sep::before{content:"\00b7"}
.tpl-executive .cv-sec{margin-top:calc(8pt*var(--sp))}
.tpl-executive .sec-h{display:flex;align-items:center;gap:9pt;font-size:calc(11.5pt*var(--fs));font-variant:small-caps;font-weight:bold;letter-spacing:1.6pt;line-height:1.2;margin-bottom:calc(5pt*var(--sp))}
.tpl-executive .sec-h::before,.tpl-executive .sec-h::after{content:"";flex:1;border-top:.6pt solid #111}
.tpl-executive .kind-entries .sec-body>.cv-item+.cv-item,.tpl-executive .kind-text .sec-body>.cv-item+.cv-item{margin-top:calc(6pt*var(--sp))}
.tpl-executive .kind-entries .cv-item{display:grid;grid-template-columns:1fr auto;column-gap:10pt;align-items:baseline}
.tpl-executive .kind-entries .cv-item>*{grid-column:1/-1}
.tpl-executive .kind-entries .e-row{display:contents}
.tpl-executive .kind-entries .e-left{grid-column:1;grid-row:1}
.tpl-executive .kind-entries .e-place{grid-column:2;grid-row:1;text-align:right}
.tpl-executive .kind-entries .e-sub{grid-column:1;grid-row:2;font-style:italic}
.tpl-executive .kind-entries .e-date{grid-column:2;grid-row:2;text-align:right;font-style:italic}
.tpl-executive .kind-entries .cv-item:not(:has(.e-place)) .e-date{grid-row:1;font-style:normal}
.tpl-executive .e-title{font-weight:bold;font-size:calc(11pt*var(--fs))}
.tpl-executive .e-title .lnk{width:calc(8.5pt*var(--fs));height:calc(8.5pt*var(--fs));vertical-align:.05em}
.tpl-executive .dash::before{content:", "}
.tpl-executive .e-note{font-style:italic}
.tpl-executive .e-techline,.tpl-executive .e-techline.dup{display:block;font-style:italic;font-size:calc(10pt*var(--fs))}
.tpl-executive .e-detail{font-size:calc(10pt*var(--fs));margin-top:calc(2pt*var(--sp))}
.tpl-executive .e-detail .lbl{font-weight:bold}
.tpl-executive .e-bullets{margin-top:calc(2pt*var(--sp));padding-left:15pt}
.tpl-executive .e-bullets li{font-size:calc(10.5pt*var(--fs));line-height:1.22}
.tpl-executive .e-bullets li::before{content:"\2022";position:absolute;left:-10pt}
.tpl-executive .kind-skills .sec-body>.cv-item+.cv-item{margin-top:calc(1.5pt*var(--sp))}
.tpl-executive .sk-line{font-size:calc(10.5pt*var(--fs));line-height:1.3}
.tpl-executive .sk-title{font-weight:bold}
.tpl-executive .t-para{margin:0;font-size:calc(10.5pt*var(--fs));line-height:1.3;text-align:justify}

/* CV editing affordances (screen only) */
#page .cv-item,#page .cv-header{cursor:grab;transition:none}
#page .cv-header{cursor:pointer}
#page .cv-item:hover,#page .cv-header:hover{background:rgba(0,0,0,.025);box-shadow:0 0 0 3pt rgba(0,0,0,.025)}
#page .cv-item.editing,#page .cv-header.editing{background:rgba(0,122,255,.04);box-shadow:0 0 0 3pt rgba(0,122,255,.04);outline:1.5px solid var(--accent);outline-offset:3pt}
.ui{position:absolute;opacity:0;pointer-events:none;transition:opacity .1s ease;font-family:-apple-system,sans-serif;z-index:3}
.ui-x{right:-36px;top:0;width:24px;height:24px;border-radius:999px;border:0;background:rgba(255,255,255,.75);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:15px;line-height:1;box-shadow:var(--shadow-glass)}
.ui-x:hover{color:var(--danger);background:#fff}
.ui-x svg{width:13px;height:13px}.tab-x svg{width:11px;height:11px}.tab-add svg{width:15px;height:15px;display:block;margin:auto}
.sec-grip{left:-36px;top:0;width:24px;height:28px;border-radius:999px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);display:grid;place-items:center;color:var(--muted);cursor:grab;box-shadow:var(--shadow-glass)}
.sec-x{top:0;right:-36px}
.cv-item:hover>.ui,.cv-sec:hover>.ui{opacity:1;pointer-events:auto}
.cv-sec:hover>.sec-x{top:30px}
body.is-dragging .ui{display:none}
.empty-hint{display:none}
.cv-sec.is-empty .empty-hint{display:block;width:100%;border:1.5px dashed rgba(0,0,0,.16);border-radius:8px;padding:9pt;text-align:center;color:#8e8e93;font:500 11px -apple-system,sans-serif}
.cv-sec.no-h::before{content:attr(data-title);position:absolute;left:0;top:-13px;font:600 9px -apple-system,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#a1a1a6;opacity:0;transition:opacity .15s}
.cv-sec.no-h:hover::before{opacity:1}
#page.measuring .cv-sec.is-empty{display:none}

/* ghosts & drag */
.cv .ghost{opacity:.4;outline:1.5px dashed rgba(0,122,255,.6);outline-offset:2px;background:rgba(0,122,255,.04)!important;box-shadow:none!important}
.cv .ghost .ghost{outline:none;background:none!important}
.drop-ok>.sec-body{border-radius:5px;box-shadow:0 0 0 4pt rgba(0,122,255,.05);background:rgba(0,122,255,.03)}
.drag-clone{position:fixed;z-index:1000;pointer-events:none;will-change:transform;transition:transform .2s var(--ease),opacity .2s var(--ease)}
.drag-clone.cv-clone{background:#fff;padding:var(--pad,0);border-radius:calc(var(--pad,8px)*.85);box-shadow:0 0 0 calc(var(--pad,8px)/8) rgba(0,122,255,.6),0 4px 12px rgba(0,0,0,.08)}
.drag-clone.cv-clone.lifted{box-shadow:0 0 0 calc(var(--pad,8px)/8) rgba(0,122,255,.6),0 18px 44px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.08)}
.drag-clone.cv-clone>*{background:#fff!important;box-shadow:none!important;outline:none!important;opacity:1!important;margin:0!important}
.drag-clone.lib-clone{border-radius:9px;background:rgba(255,255,255,.7);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.drag-clone.lib-clone>*{opacity:1!important;transform:none!important;margin:0;background:transparent!important}
.drag-clone.lifted{box-shadow:var(--shadow-glass),0 18px 44px rgba(0,0,0,.18)}
.drag-clone.flying{transition:transform .24s var(--ease),opacity .12s ease .14s}
.drag-clone.returning{transition:transform .22s var(--ease),opacity .12s ease .1s}
.drag-clone.poof{transition:transform .16s var(--ease),opacity .16s var(--ease);opacity:0}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none!important}
.cv .snapped::after{content:"";position:absolute;inset:-3pt;border-radius:4px;background:rgba(0,122,255,.1);pointer-events:none;opacity:0;animation:tint-fade .4s var(--ease)}

/* ---------- inspector (editor) ---------- */
#editor{position:absolute;top:0;right:0;bottom:0;width:var(--ed-w);background:var(--panel);border-left:1px solid var(--hair);transform:translateX(100%);visibility:hidden;transition:transform .2s var(--ease),visibility 0s .2s;display:flex;flex-direction:column;z-index:20;overflow:hidden}
#editor.open{transform:none;visibility:visible;transition:transform .24s var(--ease-drawer),visibility 0s}
#editor.instant,#editor.instant.open{transition:none}
.ed-head{display:flex;align-items:center;gap:8px;padding:12px 10px 10px 16px;border-bottom:1px solid var(--hair-soft)}
.ed-chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.06);color:var(--ink-2)}
.ed-head h3{margin:0;font-size:14px;font-weight:650;letter-spacing:-.015em;flex:1}
.ed-body{flex:1;overflow:auto;padding:14px 16px 20px}
.ed-foot{display:flex;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--hair-soft);background:var(--panel)}
.ed-foot .btn:not(.primary){background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.16),0 .5px 1px rgba(0,0,0,.06)}
.ed-foot .btn:not(.primary):hover{background:#f4f4f6}
.ed-foot .grow{flex:1}
.ed-foot .btn.danger{margin-left:10px}
.fld{margin-bottom:12px}
.fld label,.ed-label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld label em,.ed-label em{font-style:normal;color:var(--muted);font-weight:450}
input[type=text],input[type=url],textarea,select{width:100%;font:inherit;font-size:13px;border:0;border-radius:6px;padding:6px 9px;background:var(--field);color:var(--ink);box-shadow:0 0 0 .5px rgba(0,0,0,.2),inset 0 .5px 1px rgba(0,0,0,.04);transition:none;outline:none}
input::placeholder,textarea::placeholder{color:#737378}
textarea{resize:none;line-height:1.45;display:block;overflow:hidden}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 1px var(--accent),0 0 0 3.5px rgba(0,122,255,.25)}
.row2{display:grid;grid-template-columns:96px 1fr;gap:8px}
.b-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.b-row{display:flex;gap:6px;align-items:flex-start;transition:opacity .2s}
.b-row.off{opacity:.5}
.d-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.fld .d-label label{margin-bottom:0}
.fld .d-show{display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--ink-2);cursor:pointer}
.d-show .chk{width:14px;height:14px;margin:0}
.d-show .chk:checked::after{width:3px;height:7px}
.b-row textarea{font-size:12.5px;padding:6px 8px}
.chk{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:4px;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);margin:7px 0 0;flex:none;cursor:pointer;display:grid;place-items:center;transition:transform .16s var(--ease);background:#fff}
.chk:checked{background:var(--accent);box-shadow:none}
.chk:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-.5px,-1px)}
.chk:active{transform:scale(.97)}
.b-tools{display:flex;flex-direction:column;gap:0;margin-top:2px}
.b-tools .mini{width:24px;height:24px}
.b-tools .mini svg{width:14px;height:14px}
.mini.del:hover{color:var(--danger)}
.addline{width:100%;height:30px;border:0;border-radius:6px;background:transparent;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink-2);font-weight:500;cursor:pointer;transition:transform .16s var(--ease)}
.addline:hover{background:rgba(0,0,0,.04);color:var(--ink)}
.addline:active{transform:scale(.97)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin:6px 0 12px}
.hint code{background:rgba(0,0,0,.05);border-radius:4px;padding:1px 5px;font-size:11px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{color:#fff!important;background:var(--danger)!important}
.checkline{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;margin:4px 0 14px}
.checkline .chk{margin:0}
.ct-row{display:grid;grid-template-columns:1fr 1fr 24px;gap:6px;margin-bottom:6px;align-items:center}

.toast{position:fixed;left:calc(var(--side-w) + (100% - var(--side-w))/2);top:66px;transform:translate(-50%,-8px);background:rgba(255,255,255,.66);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--ink);padding:8px 16px;border-radius:999px;font-weight:550;font-size:12.5px;box-shadow:var(--shadow-glass),0 10px 30px rgba(0,0,0,.12);opacity:0;transition:opacity .15s var(--ease),transform .15s var(--ease);z-index:2000;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0);transition:opacity .22s var(--ease),transform .22s var(--ease)}

/* ---------- reduced motion: no movement, keep gentle fades ---------- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-property:opacity!important;animation-name:none!important}
  .lib-card.flash::after,.cv .snapped::after{animation:tint-fade .4s ease!important}
  .fit-pill.changed .ind,.fit-pill.changed #fitText{animation:fade-in .15s ease!important}

  .btn:active,.mini:active,.lc-badge:active,.lib-new:active,.tab:active,.tab-add:active,.chk:active,.addline:active,.lib-card:active{transform:none}
}

/* ---------- print = the PDF ---------- */
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;height:auto!important;overflow:visible!important}
  body *{visibility:hidden}
  #page,#page *{visibility:visible}

  #app{display:block;height:auto}
  #main{overflow:visible}
  #stage{position:static;overflow:visible;padding:0!important}
  #pageWrap{width:auto!important;height:auto!important;margin:0}
  #page{transform:none!important;box-shadow:none!important;border-radius:0;min-height:0!important;margin:0}
  #page .ui,#page .page-break,#page .empty-hint,#page .cv-sec.is-empty{display:none!important}

  .cv-item{break-inside:avoid}
  .sec-h{break-after:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
/* ================= constants ================= */
const PT = 96/72, PAGE_W = 210*96/25.4, PAGE_H = 297*96/25.4;
// Page looks. padY = top + bottom page padding in pt, matching #page.tpl-<id> in the CSS.
const TEMPLATES = {
  classic:   {name:'Classic',     desc:'LaTeX-style serif, after Jake\u2019s Resume', padY:54},
  blue:      {name:'Blue Accent', desc:'Clean sans serif with blue headings',        padY:33},
  timeline:  {name:'Timeline',    desc:'Dates in a left column, after moderncv',     padY:54},

};
const STORE = 'cvblocks.v1';
const PALETTE = ['#667eea','#10b981','#f59e0b','#ec4899','#06b6d4','#8b5cf6','#ef4444','#14b8a6'];
const LINK_SVG = '<svg class="lnk" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
const GRIP = '<svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.4"/><circle cx="7.5" cy="2.5" r="1.4"/><circle cx="2.5" cy="7" r="1.4"/><circle cx="7.5" cy="7" r="1.4"/><circle cx="2.5" cy="11.5" r="1.4"/><circle cx="7.5" cy="11.5" r="1.4"/></svg>';
const CHEV = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>';
const ICON = d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON_CHECK = ICON('<path d="M20 6 9 17l-5-5"/>'), ICON_PLUS = ICON('<path d="M12 5v14M5 12h14"/>'), ICON_EDIT = ICON('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>');
const ICON_ALERT = ICON('<path d="M12 7v6"/><path d="M12 17h.01"/>');
const ICON_UP = ICON('<path d="m18 15-6-6-6 6"/>'), ICON_DOWN = ICON('<path d="m6 9 6 6 6-6"/>'), ICON_X = ICON('<path d="M18 6 6 18M6 6l12 12"/>');

/* ================= starter template =================
   Sample content from "Jake's Resume" by Jake Gutierrez (MIT License,
   https://github.com/jakegut/resume). Jake Ryan is a fictional person.
   Personal CVs live in each user's own app data (and their backups), never here. */
function defaults(){
  const B = (...a)=>a.map(t=>({t,on:true}));
  const content = {
    summary:{title:'Summary',kind:'text',hideHeading:true,onCV:false,items:[
      {text:'Computer Science graduate with full-stack and research experience, looking for a software engineering role. Tailor this line to each application, or leave it off the page.'}
    ]},

      {title:'Southwestern University',date:'Aug. 2018 – May 2021',subtitle:'Bachelor of Arts in Computer Science, Minor in Business',place:'Georgetown, TX'},

      {title:'Undergraduate Research Assistant',date:'June 2020 – Present',subtitle:'Texas A&M University',place:'College Station, TX',bullets:B(
        'Developed a REST API using FastAPI and PostgreSQL to store data from learning management systems',

        'Communicate with managers to set up campus computers used on campus',

        'Maintain upkeep of computers, classroom equipment, and 200 printers across campus')},

        'Developed a game in Java to test the generated dungeons',
        'Contributed 50K+ lines of code to an established codebase via Git',
        'Conducted a human subject study to determine which video game dungeon generation technique is enjoyable',

        'Presented virtually to the World Conference on Computational Intelligence')}
    ]},
    projects:{title:'Projects',kind:'entries',items:[
      {title:'Gitlytics',tech:'Python, Flask, React, PostgreSQL, Docker',date:'June 2020 – Present',bullets:B(
        'Developed a full-stack web application using with Flask serving a REST API with React as the frontend',
        "Implemented GitHub OAuth to get data from user's repositories",
        'Visualized GitHub data to show collaboration',
        'Used Celery and Redis for asynchronous tasks')},

        'Published plugin to websites gaining 2K+ downloads and an average 4.5/5-star review',
        'Implemented continuous delivery using TravisCI to build the plugin upon new a release',
