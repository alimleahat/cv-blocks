name: Build installers

# Push a tag like v1.0.0 and this builds the Mac .dmg and Windows setup .exe,
# then attaches them to a draft GitHub Release for you to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the draft once, up front, so the Mac and Windows builds
  # both upload into it instead of racing to create two drafts.
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes "Download the file for your computer under Assets."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: draft
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and upload to release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
